<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- favicon -->
    <link rel="icon" href="/favicon/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon/favicon-48x48.png" />
    <link rel="apple-touch-icon" href="/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#ffffff" />

    <title>MY OFFICE</title>
    <meta name="description" content="회사생활에 필요한 개인 정보를 한곳에서. 연차·지원비·일정·프로젝트 바로가기." />

    <!-- Open Graph -->
    <!-- 절대 URL 은 .env 의 VITE_SITE_URL 로 치환됩니다 -->
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MY OFFICE" />
    <meta property="og:title" content="MY OFFICE — 회사생활, 이것저것 찾지 말고 한눈에" />
    <meta property="og:description" content="남은 연차, 지원비 잔액, 다음 휴일, 언제 연차를 쓰면 좋은지. 나만의 대시보드에서 빠르게 확인하세요." />
    <meta property="og:image" content="%VITE_SITE_URL%/favicon/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="MY OFFICE — 개인 맞춤형 회사생활 대시보드" />
    <meta property="og:locale" content="ko_KR" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MY OFFICE — 회사생활, 이것저것 찾지 말고 한눈에" />
    <meta name="twitter:description" content="남은 연차, 지원비 잔액, 다음 휴일, 언제 연차를 쓰면 좋은지. 나만의 대시보드에서 빠르게 확인하세요." />
    <meta name="twitter:image" content="%VITE_SITE_URL%/favicon/og-image.png" />

    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
